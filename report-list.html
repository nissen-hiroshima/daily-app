<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>日報一覧</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            background: #f3f3f3;
            font-family: "Yu Gothic", "Meiryo", sans-serif;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        h1 {
            margin: 0;
            font-size: 30px;
        }

        button {
            padding: 10px 20px;
            border: 1px solid #aaa;
            background: white;
            cursor: pointer;
            font-size: 14px;
        }

        .search-box {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
        }

        .search-box label {
            margin-right: 10px;
        }

        .search-box input {
            padding: 8px;
            font-size: 14px;
        }

        .report-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .report-card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.05);
        }

        .report-header {
            display: flex;
            gap: 30px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .work {
            margin-top: 10px;
            padding: 12px;
            background: #f7f7f7;
            white-space: pre-wrap;
        }

        .empty {
            background: white;
            padding: 40px;
            text-align: center;
            color: #777;
        }

        /* カレンダー */

.calendar-box {
    background: white;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
}

.calendar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.calendar-header button {
    padding: 8px 15px;
}

.calendar-title {
    font-size: 20px;
    font-weight: bold;
}

.calendar {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
}

.calendar th {
    padding: 10px;
    background: #f5f5f5;
    text-align: center;
}

.calendar td {
    height: 90px;
    border: 1px solid #ddd;
    vertical-align: top;
    padding: 8px;
    cursor: pointer;
}

.calendar td:hover {
    background: #f5f5f5;
}

.calendar .other-month {
    color: #bbb;
    background: #fafafa;
}

.calendar .today {
    border: 2px solid #333;
}

.calendar-date {
    font-weight: bold;
    margin-bottom: 5px;
}

.calendar-report {
    font-size: 12px;
    background: #e9eef7;
    padding: 3px 5px;
    margin-top: 4px;
    border-radius: 3px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.selected-date {
    margin-top: 20px;
    font-size: 18px;
    font-weight: bold;
}

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .top {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .search-box {
                display: flex;
                flex-direction: column;
                gap: 12px;
            }

            .search-box label {
                margin: 0;
            }

            .report-header {
                flex-direction: column;
                gap: 5px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="top">

        <h1>日報一覧</h1>

        <button onclick="goHome()">
            ← 業務管理TOP
        </button>

    </div>


    <!-- 検索 -->

    <div class="search-box">

        <label>
            日付：
            <input type="date" id="searchDate">
        </label>

        <label>
            氏名：
            <input type="text" id="searchName" placeholder="氏名を入力">
        </label>

        <button onclick="searchReports()">
            検索
        </button>

        <button onclick="loadReports()">
            すべて表示
        </button>

    </div>


    <!-- カレンダー -->

<div class="calendar-box">

    <div class="calendar-header">

        <button onclick="changeMonth(-1)">
            ＜
        </button>

        <div class="calendar-title" id="calendarTitle">
        </div>

        <button onclick="changeMonth(1)">
            ＞
        </button>

    </div>

    <table class="calendar">

        <thead>
            <tr>
                <th>月</th>
                <th>火</th>
                <th>水</th>
                <th>木</th>
                <th>金</th>
                <th>土</th>
                <th>日</th>
            </tr>
        </thead>

        <tbody id="calendarBody">
        </tbody>

    </table>

</div>


<!-- 選択した日の日報 -->

<div class="report-list" id="reportList">

    <div class="empty">
        カレンダーの日付をクリックしてください。
    </div>

</div>

</div>


<script>

const GAS_URL =
    "https://script.google.com/macros/s/AKfycbwsjbYUoSzwzz2ftgYn-BVX-vA1PdixZ_xpA1egFNxgTVQjbeIoa_8mMT02wu2WVa_f0w/exec";

let allReports = [];

let currentDate = new Date();


// TOPへ戻る
function goHome() {

    window.location.href = "index.html";

}


// 日報を読み込む
async function loadReports() {

    try {

        const response =
            await fetch(GAS_URL);

        const data =
            await response.json();

        allReports = data;

        createCalendar();

    } catch (error) {

        console.error(error);

        document.getElementById("reportList").innerHTML = `
            <div class="empty">
                日報の読み込みに失敗しました。
            </div>
        `;

    }

}


// 日付をYYYY-MM-DDにする
function formatDate(date) {

    return date.getFullYear() +
        "-" +
        String(date.getMonth() + 1).padStart(2, "0") +
        "-" +
        String(date.getDate()).padStart(2, "0");

}


// 日報の日付を統一
function getReportDate(report) {

    if (!report.date) {
        return "";
    }

    const date =
        new Date(report.date);

    if (!isNaN(date)) {

        return formatDate(date);

    }

    return String(report.date)
        .replace(/\//g, "-")
        .substring(0, 10);

}


// カレンダー作成
function createCalendar() {

    const year =
        currentDate.getFullYear();

    const month =
        currentDate.getMonth();

    document.getElementById("calendarTitle").textContent =
        year + "年" + (month + 1) + "月";


    const firstDay =
        new Date(year, month, 1);

    const lastDay =
        new Date(year, month + 1, 0);


    const startDay =
        (firstDay.getDay() + 6) % 7;

    const daysInMonth =
        lastDay.getDate();


    const tbody =
        document.getElementById("calendarBody");

    tbody.innerHTML = "";


    let day = 1;


    for (let week = 0; week < 6; week++) {

        const tr =
            document.createElement("tr");


        for (let weekday = 0; weekday < 7; weekday++) {

            const td =
                document.createElement("td");


            // 前月部分
            if (week === 0 && weekday < startDay) {

                const prevDate =
                    new Date(year, month, 0 - (startDay - weekday - 1));

                td.className = "other-month";

                td.innerHTML = `
                    <div class="calendar-date">
                        ${prevDate.getDate()}
                    </div>
                `;

            }

            // 翌月部分
            else if (day > daysInMonth) {

                const nextDate =
                    new Date(year, month, day);

                td.className = "other-month";

                td.innerHTML = `
                    <div class="calendar-date">
                        ${nextDate.getDate()}
                    </div>
                `;

                day++;

            }

            // 当月
            else {

                const date =
                    new Date(year, month, day);

                const dateString =
                    formatDate(date);


                td.innerHTML = `
                    <div class="calendar-date">
                        ${day}
                    </div>
                `;


                // 今日
                const today =
                    new Date();

                if (
                    dateString ===
                    formatDate(today)
                ) {

                    td.classList.add("today");

                }


                // その日に日報があるか確認
                const dayReports =
                    allReports.filter(function(report) {

                        return getReportDate(report) === dateString;

                    });


                // 日報がある場合
                dayReports.forEach(function(report) {

                    const reportDiv =
                        document.createElement("div");

                    reportDiv.className =
                        "calendar-report";

                    reportDiv.textContent =
                        report.name || "日報あり";

                    td.appendChild(reportDiv);

                });


                // 日付クリック
                td.onclick = function() {

                    showReportsByDate(dateString);

                };


                day++;

            }


            tr.appendChild(td);

        }


        tbody.appendChild(tr);

        if (day > daysInMonth) {
            break;
        }

    }

}


// 月を変更
function changeMonth(amount) {

    currentDate.setMonth(
        currentDate.getMonth() + amount
    );

    createCalendar();

}


// 選択した日の一覧を表示
function showReportsByDate(dateString) {

    const list =
        document.getElementById("reportList");

    const reports =
        allReports.filter(function(report) {

            return getReportDate(report) === dateString;

        });


    list.innerHTML = "";


    // 日報がない場合
    if (reports.length === 0) {

        list.innerHTML = `
            <div class="empty">
                この日の日報はありません。
            </div>
        `;

        return;

    }


    // 日付表示
    const title =
        document.createElement("div");

    title.className =
        "selected-date";

    title.textContent =
        dateString.replace(/-/g, "/") +
        "の日報";

    list.appendChild(title);


    // 新しい順
    const sortedReports =
        [...reports].reverse();


    sortedReports.forEach(function(report) {

        const card =
            document.createElement("div");

        card.className =
            "report-card";

        card.style.cursor =
            "pointer";


        card.onclick = function() {

            const savedReports =
                JSON.parse(
                    localStorage.getItem("adminComments") || "{}"
                );


            const key =
                String(report.date || "") +
                "_" +
                String(report.name || "");


            if (savedReports[key]) {

                report.adminComment =
                    savedReports[key];

            }


            localStorage.setItem(
                "selectedReport",
                JSON.stringify(report)
            );


            window.location.href =
                "report-detail.html";

        };


        // 作業内容
        let workText = "";


        if (Array.isArray(report.work)) {

            report.work.forEach(function(work) {

                if (
                    work.start ||
                    work.end ||
                    work.content
                ) {

                    workText +=
                        `${work.start || ""}～${work.end || ""}　${work.content || ""}\n`;

                }

            });

        }


        card.innerHTML = `

            <div class="report-header">

                <div>
                    日付：${dateString.replace(/-/g, "/")}
                </div>

                <div>
                    氏名：${report.name || ""}
                </div>

            </div>


            <div class="work">${workText || "作業内容なし"}</div>


            <p>

                <strong>
                    報告・連絡・相談事項
                </strong>

                <br>

                ${report.report || ""}

            </p>


            <p>

                <strong>
                    明日の予定
                </strong>

                <br>

                ${report.tomorrow || ""}

            </p>

        `;


        list.appendChild(card);

    });

}


// ページを開いたら読み込む
loadReports();

</script>

</body>
</html>
